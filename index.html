<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>The Broken List — Broken Team Demonlist</title>
        <meta
            name="description"
            content="The Broken Team demon list: ranked extreme demons, player leaderboard, and a demon roulette. Submit your records and climb the board."
        />
        <meta name="theme-color" content="#3dbb45" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="The Broken List — Broken Team Demonlist" />
        <meta
            property="og:description"
            content="Ranked extreme demons, player leaderboard and a demon roulette, run by Broken Team."
        />
        <meta name="twitter:card" content="summary" />

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="./list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Chivo+Mono:wght@400;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="./css/reset.css" />
        <link rel="stylesheet" type="text/css" href="./css/typography.css" />
        <link rel="stylesheet" type="text/css" href="./css/main.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="./css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/components/tabs.css"
        />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="./js/main.js"></script>
    </head>
    <body id="app">
        <header>
            <div class="logo">
                <div class="logo__text">
                    <h2>The Broken List</h2>
                    <p>v1.0.0</p>
                </div>
            </div>
            <nav class="nav">
                <div class="nav__tabs">
                    <router-link class="nav__tab" to="/">
                        <span class="type-label-lg">List</span>
                    </router-link>
                    <router-link class="nav__tab" to="/leaderboard">
                        <span class="type-label-lg">Leaderboard</span>
                    </router-link>
                    <router-link class="nav__tab" to="/roulette">
                        <span class="type-label-lg">Roulette</span>
                    </router-link>
                </div>
                <div class="nav__actions">
                    <button
                        class="nav__icon"
                        title="Toggle theme"
                        aria-label="Toggle theme"
                        @click.prevent="store.toggleDark()"
                    >
                        <img
                            :src="store.dark ? './assets/light.svg' : './assets/dark.svg'"
                            alt=""
                        />
                    </button>
                    <!-- Replace the '#' with your discord server's invite-->
                    <a
                        class="nav__icon"
                        title="Discord"
                        href="https://discord.gg/swuWBj59yp"
                        target="_blank"
                        rel="noopener"
                    >
                        <img src="./assets/discord.svg" alt="Discord" />
                    </a>
                    <!-- List record submission form -->
                    <a
                        class="nav__cta type-label-lg"
                        href="https://forms.gle/2j7Xy5QLZqG3sijj9"
                        target="_blank"
                        rel="noopener"
                        >Submit Record</a
                    >
                </div>
            </nav>
        </header>
        <router-view></router-view>
    </body>
</html>
