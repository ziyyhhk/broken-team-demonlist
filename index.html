    <!--
        NOTE: <body> deliberately has NO id. Vue mounts on the
        <div id="app"> below. This keeps the <header> as plain
        HTML so Vue can never replace it.
    -->
    <body>
        <header>
            <div class="logo">
                <div class="logo__text">
                    <h2>The Broken List</h2>
                    <p>v1.0.0</p>
                </div>
            </div>
            <nav class="nav">
                <div class="nav__tabs">
                    <router-link class="nav__tab" to="/">
                        <span class="type-label-lg">List</span>
                    </router-link>
                    <router-link class="nav__tab" to="/leaderboard">
                        <span class="type-label-lg">Leaderboard</span>
                    </router-link>
                    <router-link class="nav__tab" to="/roulette">
                        <span class="type-label-lg">Roulette</span>
                    </router-link>
                </div>
                <div class="nav__actions">
                    <button
                        class="nav__icon"
                        title="Toggle theme"
                        aria-label="Toggle theme"
                        @click.prevent="store.toggleDark()"
                    >
                        <img
                            :src="store.dark ? './assets/light.svg' : './assets/dark.svg'"
                            alt=""
                        />
                    </button>
                    <!-- Replace the '#' with your discord server's invite-->
                    <a
                        class="nav__icon"
                        title="Discord"
                        href="https://discord.gg/swuWBj59yp"
                        target="_blank"
                        rel="noopener"
                    >
                        <img src="./assets/discord.svg" alt="Discord" />
                    </a>
                    <!-- List record submission form -->
                    <a
                        class="nav__cta type-label-lg"
                        href="https://forms.gle/2j7Xy5QLZqG3sijj9"
                        target="_blank"
                        rel="noopener"
                        >Submit Record</a
                    >
                </div>
            </nav>
        </header>
        <!-- Vue mounts here. The <transition> inside the app template
             fades pages on every route change. -->
        <div id="app"></div>
